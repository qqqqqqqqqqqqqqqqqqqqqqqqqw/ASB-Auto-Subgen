GROQ_API_KEY: ''
RUN_ASB_WEBSOCKET_SERVER: true
cookies: ''
language: ja
model: whisper-large-v3-turbo # for groq
whisper_model: turbo
output_dir: subs
process_locally: false
skip_language_check: true
enable_translation: true
translation_service: google # "google" or "groq"
groq_translation_model: llama-3.3-70b-versatile
translation_temperature: 0.0
groq_translation_batch_segments: 50 # segments per Groq translation request
groq_translation_batch_delay: 5.0   # seconds between batches (Groq free tier: ~30 RPM)
translation_target_language: en
monitor_clipboard: true # if set to false, pass link as argument instead
download_lower_audio_quality: false
downsample_audio: true